---
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 20
    labels:
      - dependencies
    commit-message:
      prefix: deps
    reviewers:
      - worgarside

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: deps
    reviewers:
      - worgarside
