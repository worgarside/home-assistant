---
name: Set PR Auto Merge

# yamllint disable-line rule:truthy
on:
  pull_request:
    types:
      - opened
      - ready_for_review

concurrency:
  group: set-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  set-auto-merge:
    name: Set PR Auto Merge
    if: ${{ !github.event.pull_request.draft }}
    # github-config-files has no releases; pin the latest audited main commit.
    # yamllint disable-line rule:line-length
    uses: worgarside/github-config-files/.github/workflows/__set_pr_auto_merge.yml@be008ae8f54348a000172e13598711c384dbc69b
    with:
      head-ref: ${{ github.head_ref }}
      pr-html-url: ${{ github.event.pull_request.html_url }}
      pr-number: ${{ github.event.pull_request.number }}
      pr-title: ${{ github.event.pull_request.title }}
    secrets: inherit
