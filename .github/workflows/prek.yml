---
name: Prek

on:
  workflow_dispatch:
  merge_group:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: prek-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  prek:
    name: Prek
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Run prek
        id: prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        continue-on-error: true
        with:
          cache: true
          extra-args: --all-files
          prek-version: 0.4.12

      - name: Detect auto-fixes
        id: changes
        if: steps.prek.outcome == 'failure'
        run: |
          if [[ -n "$(git status --short)" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit auto-fixes
        if: >-
          steps.prek.outcome == 'failure' &&
          steps.changes.outputs.has_changes == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        env:
          PUSH_TOKEN: ${{ secrets.WORGARSIDE_DEV_TOKEN }}
          REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "worgarside-dev"
          git config user.email "worgarside.dev@gmail.com"
          git add --all
          git commit -m "style: apply prek auto-fixes"
          git push \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${REF}"

      - name: Fail for unfixable hook errors
        if: >-
          steps.prek.outcome == 'failure' &&
          (
            steps.changes.outputs.has_changes != 'true' ||
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name != github.repository ||
            github.actor == 'dependabot[bot]'
          )
        run: exit 1
