---
name: Validate Home Assistant Config

on:
  workflow_dispatch:
  merge_group:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: >-
    validate-home-assistant-config-${{
      github.event.pull_request.number ||
      github.event.merge_group.head_sha ||
      github.ref
    }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare validation
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.current-version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned Home Assistant version
        id: current-version
        run: echo "version=$(<.HA_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Fetch pinned custom components
        env:
          PLEX_RECENTLY_ADDED_SHA: 892bdb633867a17650a942e5bb10b46666f1a3c6
          SPOTCAST_SHA: d54c8dcfffc4df31182ccfcd4201dc0e36d30d61
          VAR_SHA: 040058b53fc790c5f6a21cd2855958b02b83753b
        run: |
          set -euo pipefail

          component_root="${RUNNER_TEMP}/custom_components"
          checkout_root="${RUNNER_TEMP}/component_sources"
          mkdir -p "$component_root" "$checkout_root"

          fetch_component() {
            local repository="$1"
            local revision="$2"
            local destination
            destination="${checkout_root}/$(basename "$repository")"

            git init --quiet "$destination"
            git -C "$destination" remote add origin "https://github.com/${repository}.git"
            git -C "$destination" fetch --quiet --depth 1 origin "$revision"
            git -C "$destination" checkout --quiet --detach FETCH_HEAD
            cp -R "$destination/custom_components/." "$component_root/"
          }

          fetch_component \
            snarky-snark/home-assistant-variables \
            "$VAR_SHA"
          fetch_component fondberg/spotcast "$SPOTCAST_SHA"
          fetch_component \
            custom-components/sensor.plex_recently_added \
            "$PLEX_RECENTLY_ADDED_SHA"

      - name: Upload custom components
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custom-components
          path: ${{ runner.temp }}/custom_components
          if-no-files-found: error
          retention-days: 1

  validate-home-assistant-config:
    name: Home Assistant ${{ matrix.version }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ matrix.experimental }}
    needs:
      - prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: stable
            experimental: false
          - version: beta
            experimental: true
          - version: dev
            experimental: true
          - version: ${{ needs.prepare.outputs.version }}
            experimental: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download custom components
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: custom-components
          path: custom_components

      - name: Local Workspace Workarounds
        run: |
          mkdir -p ./.storage

          sed -i 's/\/config/\/github\/workspace/g' integrations/zha.yaml

          sed -i 's/\/config/\/github\/workspace/g' configuration.yaml

          touch scenes.yaml

      - name: Validate Configuration
        # No releases exist; retain the audited fork commit because main diverged.
        uses: worgarside/action-home-assistant@2ed46e0ffded84d4c67d751e43ef0f2f9d8146aa
        with:
          path: .
          secrets: secrets.fake.yaml
          version: ${{ matrix.version }}
          catch_error_logs: ${{ !matrix.experimental }}
          ignore_error_log_pattern: >-
            failed to setup triggers and has been disabled: Unknown device '[0-9a-f]{32}'
