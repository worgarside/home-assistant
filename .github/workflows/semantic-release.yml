---
name: Semantic Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force-deployment:
        description: Force a release at a specific level, bypassing normal detection
        required: false
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    uses: worgarside/github-config-files/.github/workflows/__semantic-release.yml@main
    with:
      python-version: '3.12'
      force-deployment: ${{ inputs.force-deployment != 'auto' && inputs.force-deployment || '' }}
    secrets: inherit
