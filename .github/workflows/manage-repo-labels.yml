---
name: Manage Repo Labels

on:
  push:
    branches:
      - main
    paths:
      - .github/repo_labels.yml
      - .github/workflows/manage_repo_labels.yml
  workflow_dispatch:

jobs:
  manage-repo-labels:
    name: Manage Repo Labels
    # github-config-files has no releases; pin the latest audited main commit.
    # yamllint disable-line rule:line-length
    uses: worgarside/github-config-files/.github/workflows/__manage-repo-labels.yml@be008ae8f54348a000172e13598711c384dbc69b
    permissions:
      issues: write
