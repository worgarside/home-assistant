---
name: Semantic Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_release:
        description: Force a release level or detect it from commits
        required: true
        default: none
        type: choice
        options:
          - none
          - prerelease
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Required so semantic-release can push with the deploy key.
          persist-credentials: true
          ref: ${{ github.ref }}
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Release
        id: release
        # yamllint disable-line rule:line-length
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e # v10.6.1
        with:
          github_token: ${{ github.token }}
          git_committer_name: worgarside-dev
          git_committer_email: worgarside.dev@gmail.com
          config_file: pyproject.toml
          force: >-
            ${{
              inputs.force_release != 'none' &&
              inputs.force_release ||
              ''
            }}
          strict: true
          verbosity: 2

      - name: Summarize release
        if: steps.release.outputs.released == 'true'
        env:
          RELEASE_LINK: ${{ steps.release.outputs.link }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          {
            echo "## Released ${RELEASE_TAG}"
            echo
            echo "${RELEASE_LINK}"
          } >> "$GITHUB_STEP_SUMMARY"
