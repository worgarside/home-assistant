---
name: PR Cleanup

on:
  pull_request:
    types:
      - closed

jobs:
  pr-cleanup:
    name: PR Cleanup
    # github-config-files has no releases; pin the latest audited main commit.
    # yamllint disable-line rule:line-length
    uses: worgarside/github-config-files/.github/workflows/__pr_cleanup.yml@be008ae8f54348a000172e13598711c384dbc69b
    permissions:
      contents: write
      pull-requests: write
    with:
      head-ref: ${{ github.head_ref }}
      pr-label-names: ${{ join(github.event.pull_request.labels.*.name) }}
      pr-merged: ${{ github.event.pull_request.merged }}
      pr-number: ${{ github.event.pull_request.number }}
    secrets: inherit
