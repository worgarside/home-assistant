---
# Diagnostic retained Frigate evidence for the room-level Bayesian sensors.
# FP2 remains authoritative for basement control automations.
name: Basement Human Presence

unique_id: basement_human_presence

device_class: occupancy

availability: >-
  {{ states('binary_sensor.basement_person_occupancy') in ['on', 'off'] }}

delay_off: >-
  {{ {'seconds': states('input_number.basement_lights_timeout') | int(300)} }}

state: "{{ is_state('binary_sensor.basement_person_occupancy', 'on') }}"
