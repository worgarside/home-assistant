---
alias: System Reload Domain

description: >-
  Reload a Home Assistant domain and clear only the auto-reload queue snapshot
  captured for that reload. New file changes during the reload remain pending.

mode: queued

max: 50

max_exceeded: silent

fields:
  domain:
    name: Domain
    description: The reloadable domain to reload
    required: true
    selector:
      select:
        options:
          - automation
          - command_line
          - conversation
          - group
          - input_boolean
          - input_button
          - input_datetime
          - input_number
          - input_select
          - input_text
          - mqtt
          - rest
          - rest_command
          - scene
          - schedule
          - script
          - template
          - timer
          - universal
          - var
          - zone

variables:
  raw_pending: "{{ state_attr('var.auto_reload_queue', 'pending') }}"

  pending: >-
    {{
      raw_pending
      if raw_pending is mapping
      else (raw_pending | default('{}', true) | from_json)
    }}

  snapshot: "{{ pending.get(domain, []) }}"

sequence:
  - choose:
      - conditions: "{{ domain == 'script' }}"
        sequence:
          - if: "{{ snapshot | length > 0 }}"
            then:
              - variables:
                  remaining_files: >-
                    {{
                      pending.get(domain, [])
                      | reject('in', snapshot)
                      | list
                    }}

                  new_pending: >-
                    {% set ns = namespace(result={}) %}
                    {% for key, value in pending.items() %}
                      {% if key != domain %}
                        {% set ns.result = dict(ns.result, **{key: value}) %}
                      {% elif remaining_files | length > 0 %}
                        {% set ns.result = dict(ns.result, **{key: remaining_files}) %}
                      {% endif %}
                    {% endfor %}
                    {{ ns.result }}

                  pending_domain_count: >-
                    {{ new_pending.values() | reject('eq', []) | list | count }}

              - action: var.set
                target:
                  entity_id: var.auto_reload_queue
                data:
                  value: "{{ pending_domain_count }}"
                  attributes: >-
                    {{
                      {
                        "pending": new_pending | to_json
                      }
                    }}

          - action: script.reload

    default:
      - action: "{{ domain }}.reload"

      - if: "{{ snapshot | length > 0 }}"
        then:
          - variables:
              raw_pending_after: "{{ state_attr('var.auto_reload_queue', 'pending') }}"

              pending_after: >-
                {{
                  raw_pending_after
                  if raw_pending_after is mapping
                  else (raw_pending_after | default('{}', true) | from_json)
                }}

              remaining_files: >-
                {{
                  pending_after.get(domain, [])
                  | reject('in', snapshot)
                  | list
                }}

              new_pending: >-
                {% set ns = namespace(result={}) %}
                {% for key, value in pending_after.items() %}
                  {% if key != domain %}
                    {% set ns.result = dict(ns.result, **{key: value}) %}
                  {% elif remaining_files | length > 0 %}
                    {% set ns.result = dict(ns.result, **{key: remaining_files}) %}
                  {% endif %}
                {% endfor %}
                {{ ns.result }}

              pending_domain_count: >-
                {{ new_pending.values() | reject('eq', []) | list | count }}

          - action: var.set
            target:
              entity_id: var.auto_reload_queue
            data:
              value: "{{ pending_domain_count }}"
              attributes: >-
                {{
                  {
                    "pending": new_pending | to_json
                  }
                }}
