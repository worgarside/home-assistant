---
alias: Notify Vic

description: Send a notification to Vic's devices

fields:
  title:
    description: The title of the notification
    example: Something Important!
    default: " "
    selector:
      text:

  message:
    description: The message body of the notification
    example: A thing has happened, thought you ought to know
    required: true
    selector:
      text:
        multiline: true

  clear_notification:
    description: Clear the persistent notification
    example: "true"
    selector:
      boolean:

  notification_id:
    description: Optional ID for the persistent notification
    example: important_thing_happened
    selector:
      text:

  actions:
    description: Optional actions for the phone notification
    example: '[{"action": "URI", "title": "View More", "uri": "https://example.com"}]'
    selector:
      object:

  mobile_notification_icon:
    description: Optional icon for the phone notification
    example: mdi:alert
    selector:
      icon:
        placeholder: mdi:bell

  url:
    description: |-
      URL to open when the notification is selected
      https://companion.home-assistant.io/docs/notifications/notifications-basic/#opening-a-url
    example: /home-will/makerspace
    required: false
    selector:
      text:

  group:
    description: Combine notifications together visually
    example: example-notification-group
    required: false
    selector:
      text:

  sticky:
    description: Whether to dismiss the notification upon selecting it or not
    required: false
    selector:
      boolean:

  timeout:
    description: How long the phone notification remains before being dismissed
    required: false
    selector:
      number:
        min: 0
        max: 86400
        unit_of_measurement: s

  chronometer:
    description: Show an Android count-up or countdown timer
    required: false
    selector:
      boolean:

  when:
    description: Timer reference point as a Unix timestamp or relative seconds
    required: false
    selector:
      number:

  when_relative:
    description: Treat the timer reference point as seconds from now
    required: false
    selector:
      boolean:

mode: queued

max: 50

variables:
  actions: "{{ actions | default([]) }}"

  clear_notification: >-
    {{
      message | default('') == 'clear_notification' or
      clear_notification | default(False) | bool(False)
    }}

  notification_id: >-
    {% if clear_notification %}
      {{ notification_id | default(None) }}
    {% else %}
      {{ notification_id | default('notify_vic_' ~ now().strftime('%Y%m%d%H%M%S%f')) }}
    {% endif %}

  message: >-
    {% if clear_notification %}
      clear_notification
    {% else %}
      {{ message | default("") }}
    {% endif %}

  mobile_notification_icon: "{{ mobile_notification_icon | default('mdi:home-assistant') }}"

  notif_title: "{{ title | default('Home Assistant') }}"

  url: "{{ url | default('') }}"

  group: "{{ group | default('') }}"

  sticky: "{{ sticky | default(false) }}"

  timeout: "{{ timeout | default(None) }}"

  chronometer: "{{ chronometer | default(false) }}"

  when: "{{ when | default(None) }}"

  when_relative: "{{ when_relative | default(false) }}"

sequence:
  - if: >-
      {{
        clear_notification is true and
        (
          notification_id is undefined or
          not notification_id
        )
      }}

    then:
      - stop: Invalid usage, clear_notification is true but notification_id is not set
        error: true

  - alias: iPhone
    action: notify.mobile_app_vics_iphone
    data:
      message: "{{ message }}"
      title: "{{ notif_title }}"
      data:
        actions: "{{ actions }}"
        tag: "{{ notification_id }}"
        notification_icon: "{{ mobile_notification_icon }}"
        url: "{{ url }}"
        group: "{{ group }}"
        sticky: "{{ sticky }}"
        timeout: "{{ timeout }}"
        chronometer: "{{ chronometer }}"
        when: "{{ when }}"
        when_relative: "{{ when_relative }}"

  - alias: iPad
    action: notify.mobile_app_ipad
    data:
      message: "{{ message }}"
      title: "{{ notif_title }}"
      data:
        actions: "{{ actions }}"
        tag: "{{ notification_id }}"
        notification_icon: "{{ mobile_notification_icon }}"
        url: "{{ url }}"
        group: "{{ group }}"
        sticky: "{{ sticky }}"
        timeout: "{{ timeout }}"
        chronometer: "{{ chronometer }}"
        when: "{{ when }}"
        when_relative: "{{ when_relative }}"

  - alias: MacBook Air
    if:
      or:
        - alias: MBA is active
          condition: state
          entity_id: binary_sensor.victorias_macbook_air_active
          state: "on"

        - alias: Clear Notification
          condition: template
          value_template: "{{ clear_notification }}"

    then:
      - action: notify.mobile_app_victorias_macbook_air
        data:
          message: "{{ message }}"
          title: "{{ notif_title }}"
          data:
            actions: "{{ actions }}"
            tag: "{{ notification_id }}"
            url: "{{ url }}"
            group: "{{ group }}"
            sticky: "{{ sticky }}"
            timeout: "{{ timeout }}"
            chronometer: "{{ chronometer }}"
            when: "{{ when }}"
            when_relative: "{{ when_relative }}"
