---
alias: Notify Will

description: Send a notification to Will's phone and the HA UI

fields:
  title:
    description: The title of the notification
    example: Something Important!
    default: " "
    selector:
      text:

  message:
    description: The message body of the notification
    example: A thing has happened, thought you ought to know
    required: true
    selector:
      text:
        multiline: true

  clear_notification:
    description: Clear the persistent notification
    example: "true"
    selector:
      boolean:

  notification_id:
    description: Optional ID for the persistent notification
    example: important_thing_happened
    selector:
      text:

  actions:
    description: Optional actions for the phone notification
    example: '[{"action": "URI", "title": "View More", "uri": "https://example.com"}]'
    selector:
      object:

  mobile_notification_icon:
    description: Optional icon for the phone notification
    example: mdi:alert
    selector:
      icon:
        placeholder: mdi:bell

  url:
    description: |-
      URL to open when the notification is selected
      https://companion.home-assistant.io/docs/notifications/notifications-basic/#opening-a-url
    example: /home-will/makerspace
    required: false
    selector:
      text:

  group:
    description: Combine notifications together visually
    example: example-notification-group
    required: false
    selector:
      text:

  sticky:
    description: Whether to dismiss the notification upon selecting it or not
    required: false
    selector:
      boolean:

  persistent:
    description: >-
      Block dismissing the notification via the "Clear All" button or when the device is locked
    required: false
    selector:
      boolean:

  alert_once:
    description: Only sound or vibrate once when updating an Android notification with the same tag
    required: false
    selector:
      boolean:

  image:
    description: >-
      Optional image for the notification. Companion apps accept
      /api/camera_proxy/... and /api/frigate/notifications/... directly.
      Camera-proxy paths are snapshotted to /local/images/notifications/ for
      the HA UI; absolute http(s), /local/, and /api/frigate/ paths are
      embedded as-is.
    example: /api/camera_proxy/camera.octoprint_camera
    required: false
    selector:
      text:

  timeout:
    description: >-
      How long (in seconds) the notification should be shown before being auto-dismissed.
      Only applies to phone notifications.
    example: "3600"
    required: false
    selector:
      number:
        min: 0
        max: 86400
        unit_of_measurement: s

  chronometer:
    description: Show an Android count-up or countdown timer
    required: false
    selector:
      boolean:

  when:
    description: Timer reference point as a Unix timestamp or relative seconds
    required: false
    selector:
      number:

  when_relative:
    description: Treat the timer reference point as seconds from now
    required: false
    selector:
      boolean:

mode: queued

max: 50

variables:
  actions: "{{ actions | default([]) }}"

  clear_notification: >-
    {{
      message | default('') == 'clear_notification' or
      clear_notification | default(False) | bool(False)
    }}

  notification_id: >-
    {% if clear_notification %}
      {{ notification_id | default(None) }}
    {% else %}
      {{ notification_id | default('notify_will_' ~ now().strftime('%Y%m%d%H%M%S%f')) }}
    {% endif %}

  message: >-
    {% if clear_notification %}
      clear_notification
    {% else %}
      {{ message | default("") }}
    {% endif %}

  mobile_notification_icon: "{{ mobile_notification_icon | default('mdi:home-assistant') }}"

  notif_title: "{{ title | default('Home Assistant') }}"

  url: "{{ url | default('') }}"

  group: "{{ group | default('') }}"

  sticky: "{{ sticky | default(false) }}"

  persistent: "{{ persistent | default(false) }}"

  alert_once: "{{ alert_once | default(false) }}"

  image: "{{ image | default('') }}"

  timeout: "{{ timeout | default(None) }}"

  chronometer: "{{ chronometer | default(false) }}"

  when: "{{ when | default(None) }}"

  when_relative: "{{ when_relative | default(false) }}"

  # Persistent notifications can render /local/ (www), absolute http(s), and
  # /api/frigate/notifications/... (unauthenticated proxy). Companion apps also
  # accept /api/camera_proxy/... so snapshot those to /local/ first.
  camera_entity: >-
    {{
      image
      | regex_findall('^/api/camera_proxy/(camera\\.[\\w.]+)$')
      | first
      | default(none)
    }}

  snapshot_basename: "{{ notification_id | regex_replace('[^\\w.-]', '_') }}.jpg"

  ha_image: >-
    {%- if image.startswith('/local/')
          or image.startswith('http://')
          or image.startswith('https://')
          or image.startswith('/api/frigate/') -%}
      {{ image }}
    {%- elif camera_entity -%}
      /local/images/notifications/{{ snapshot_basename }}
    {%- else -%}
    {%- endif %}

  ha_message: >-
    {%- if ha_image -%}
      {{ message }}{{ "\n\n" }}![image]({{ ha_image }})
    {%- else -%}
      {{ message }}
    {%- endif %}

sequence:
  - if: >-
      {{
        clear_notification is true and
        (
          notification_id is undefined or
          not notification_id
        )
      }}

    then:
      - stop: Invalid usage, clear_notification is true but notification_id is not set
        error: true

  - if: "{{ clear_notification }}"

    then:
      - alias: Remove HA Notification
        action: persistent_notification.dismiss
        data:
          notification_id: "{{ notification_id }}"

    else:
      - if: "{{ camera_entity is not none }}"
        then:
          - alias: Snapshot camera for HA notification
            action: camera.snapshot
            continue_on_error: true
            target:
              entity_id: "{{ camera_entity }}"
            data:
              filename: /config/www/images/notifications/{{ snapshot_basename }}

      - alias: HA Notification
        action: persistent_notification.create
        continue_on_error: true
        data:
          message: "{{ ha_message }}"
          notification_id: "{{ notification_id }}"
          title: "{{ notif_title }}"

  - alias: Phone
    action: notify.mobile_app_will_s_pixel_6_pro
    data:
      message: "{{ message }}"
      title: "{{ notif_title }}"
      data:
        actions: "{{ actions }}"
        tag: "{{ notification_id }}"
        notification_icon: "{{ mobile_notification_icon }}"
        clickAction: "{{ url }}"
        group: "{{ group }}"
        sticky: "{{ sticky }}"
        persistent: "{{ persistent }}"
        alert_once: "{{ alert_once }}"
        image: "{{ image }}"
        timeout: "{{ timeout }}"
        chronometer: "{{ chronometer }}"
        when: "{{ when }}"
        when_relative: "{{ when_relative }}"

  - alias: Personal MacBook Pro
    if:
      or:
        - alias: MBP is active
          condition: state
          entity_id: binary_sensor.wills_macbook_pro_active
          state: "on"

        - alias: Clear Notification
          condition: template
          value_template: "{{ clear_notification }}"

    then:
      - action: notify.mobile_app_wills_macbook_pro
        data:
          message: "{{ message }}"
          title: "{{ notif_title }}"
          data:
            actions: "{{ actions }}"
            tag: "{{ notification_id }}"
            group: "{{ group }}"
            url: "{{ url }}"
            image: "{{ image }}"

  - alias: Work MacBook Pro
    if:
      or:
        - alias: Work MBP is active
          condition: state
          entity_id: binary_sensor.wills_work_macbook_pro_active
          state: "on"

        - alias: Will is at the office
          condition: state
          entity_id: person.will
          state: Will Work

        - alias: Clear Notification
          condition: template
          value_template: "{{ clear_notification }}"

        # - and:
        #   - alias: It's a workday
        #     condition: state
        #     entity_id: binary_sensor.workday
        #     state: "on"

        #   - alias: Will not on A/L - TODO

    then:
      - action: notify.mobile_app_wills_work_macbook_pro
        data:
          message: "{{ message }}"
          title: "{{ notif_title }}"
          data:
            actions: "{{ actions }}"
            tag: "{{ notification_id }}"
            group: "{{ group }}"
            url: "{{ url }}"
            image: "{{ image }}"
