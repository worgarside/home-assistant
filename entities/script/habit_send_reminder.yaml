---
alias: Habit Send Reminder

description: >-
  Send a habit reminder notification, optionally generating a dynamic message
  with ai_task.generate_data when the habit's AI reminder toggle is on.

mode: parallel

max: 20

fields:
  user:
    description: Habit owner (will or vic)
    required: true
    example: will
    selector:
      select:
        options:
          - will
          - vic

  habit_type:
    description: Habit type (binary or countable)
    required: true
    example: binary
    selector:
      select:
        options:
          - binary
          - countable

  habit_number:
    description: Habit slot number
    required: true
    example: 1
    selector:
      number:
        min: 1
        max: 100
        mode: box

  reminder_index:
    description: >-
      Reminder attempt index (1 = initial, 2+ = repeats). Defaults to 1.
    required: false
    default: 1
    selector:
      number:
        min: 1
        max: 1000
        mode: box

variables:
  user: "{{ user | lower }}"
  habit_type: "{{ habit_type | lower }}"
  habit_number: "{{ habit_number | int }}"
  reminder_index: "{{ reminder_index | default(1) | int(1) }}"
  habit_prefix: "{{ user }}_habit_{{ habit_type }}_{{ habit_number }}"
  habit_name_entity: "input_text.{{ habit_prefix }}_name"
  ai_toggle_entity: "input_boolean.{{ habit_prefix }}_ai_reminder"
  streak_entity: "sensor.{{ habit_prefix }}_streak"
  habit_name: >-
    {{
      states(habit_name_entity)
      | default('Habit ' ~ (habit_type | title) ~ ' ' ~ habit_number)
    }}
  fallback_message: >-
    {{
      "Don't forget to mark " ~ habit_name ~ " as complete!"
      if habit_type == 'binary'
      else "Don't forget to track " ~ habit_name ~ "!"
    }}
  notification_id: "{{ habit_prefix }}_reminder"
  notification_url: "/home-{{ user }}/mood-habits"
  action_id: >-
    {{
      "MARK_HABIT_AS_COMPLETE__" ~ (user | upper) ~ "__BINARY_" ~ habit_number
      if habit_type == 'binary'
      else "INCREMENT_HABIT__" ~ (user | upper) ~ "__COUNTABLE_" ~ habit_number
    }}
  action_title: >-
    {{ 'Mark as Complete' if habit_type == 'binary' else 'Increment' }}
  use_ai: "{{ is_state(ai_toggle_entity, 'on') }}"
  generated_message: ""

sequence:
  - if: "{{ use_ai }}"
    then:
      - variables:
          mood_entity: "input_select.{{ user }}_mood_today"
          mood_note_entity: "input_text.{{ user }}_mood_note"
          person_entity: "person.{{ user }}"
          calendar_entities: >-
            {{ label_entities('habit_context_calendar_' ~ user) | default([], true) }}
          activity_entity: >-
            {{
              'sensor.will_s_pixel_6_pro_detected_activity'
              if user == 'will'
              else 'sensor.vics_iphone_activity'
            }}
          steps_entity: >-
            {{
              'sensor.will_s_pixel_6_pro_daily_steps'
              if user == 'will'
              else 'sensor.vics_iphone_steps'
            }}
          streak_days: >-
            {{ states(streak_entity) if has_value(streak_entity) else '' }}
          days_since_completion: >-
            {% set days = state_attr(streak_entity, 'days_since_completion') %}
            {{ days if days is not none and days | int(-1) >= 0 else '' }}
          mood_today: >-
            {{ states(mood_entity) if has_value(mood_entity) else '' }}
          mood_note: >-
            {{
              states(mood_note_entity)
              if has_value(mood_note_entity)
                and states(mood_note_entity) not in ['', 'unknown', 'unavailable']
              else ''
            }}
          location_category: >-
            {% set person_state = states(person_entity) %}
            {% set in_zones = state_attr(person_entity, 'in_zones') | default([], true) %}
            {% set home_zones = label_entities('habit_context_home') | default([]) %}
            {% set work_zones = label_entities('habit_context_work') | default([]) %}
            {% set family_zones = label_entities('habit_context_family') | default([]) %}
            {% if in_zones | select('in', home_zones) | list | count > 0 %}
              home
            {% elif in_zones | select('in', work_zones) | list | count > 0 %}
              work
            {% elif in_zones | select('in', family_zones) | list | count > 0 %}
              family location
            {% elif is_state('binary_sensor.' ~ user ~ '_at_work', 'on') %}
              work
            {% elif person_state == 'home' %}
              home
            {% elif person_state == 'not_home' %}
              away from known zones
            {% elif person_state not in ['unknown', 'unavailable', ''] %}
              known but unclassified location
            {% else %}
              unknown
            {% endif %}
          workday: "{{ 'yes' if is_state('binary_sensor.workday', 'on') else 'no' }}"
          activity_state: >-
            {{ states(activity_entity) if has_value(activity_entity) else '' }}
          steps_today: >-
            {{ states(steps_entity) | int if has_value(steps_entity) else '' }}
          bike_active_minutes: >-
            {{
              (
                states('sensor.joroto_exercise_bike_active_time')
                | float(0) / 60
              )
              | round(1)
              if has_value('sensor.joroto_exercise_bike_active_time')
              else ''
            }}
          weather_summary: >-
            {% set condition = states('weather.met_office_fulham') %}
            {% set temperature = state_attr('weather.met_office_fulham', 'temperature') %}
            {{
              condition ~ ', ' ~ temperature ~ '°C'
              if condition not in ['unknown', 'unavailable'] and temperature is not none
              else ''
            }}
          daylight_remaining: >-
            {% set setting = state_attr('sun.sun', 'next_setting') %}
            {{
              ((as_timestamp(setting) - as_timestamp(now())) / 60) | round | int
              if setting is not none and is_state('sun.sun', 'above_horizon')
              else 0
            }}
          repeat_reminder_count: >-
            {{
              states('input_number.' ~ habit_prefix ~ '_repeat_reminder_count')
              | int(0)
            }}
          reminder_attempt: >-
            {{
              'first reminder today'
              if reminder_index | int(1) == 1
              else (
                'final reminder today (attempt ' ~ reminder_index ~ ')'
                if reminder_index | int(1) > repeat_reminder_count | int(0)
                else (
                  'repeat reminder ' ~ reminder_index ~ ' of '
                  ~ (repeat_reminder_count | int(0) + 1)
                )
              )
            }}

      - if: "{{ calendar_entities | count > 0 }}"
        then:
          - alias: Get upcoming calendar events
            continue_on_error: true
            action: calendar.get_events
            response_variable: calendar_result
            target:
              entity_id: "{{ calendar_entities }}"
            data:
              duration:
                hours: 8

      - variables:
          calendar_availability: >-
            {% set calendars = calendar_result | default({}, true) %}
            {% if calendar_entities | count == 0 or calendars | count == 0 %}
              {{ '' }}
            {% else %}
              {% set now_timestamp = as_timestamp(now()) %}
              {% set ns = namespace(busy_until=0, next_start=0) %}
              {% for calendar in calendars.values() %}
                {% for event in calendar.events | default([], true) %}
                  {% if 'T' in (event.start | string) %}
                    {% set start = as_timestamp(event.start, 0) %}
                    {% set finish = as_timestamp(event.end, 0) %}
                    {% if start <= now_timestamp < finish and finish > ns.busy_until %}
                      {% set ns.busy_until = finish %}
                    {% elif start > now_timestamp and
                      (ns.next_start == 0 or start < ns.next_start) %}
                      {% set ns.next_start = start %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
              {% endfor %}
              {% if ns.busy_until > 0 %}
                in a meeting for the next
                {{ ((ns.busy_until - now_timestamp) / 60) | round | int }} minutes
              {% elif ns.next_start > 0 %}
                free for the next
                {{ ((ns.next_start - now_timestamp) / 60) | round | int }} minutes
              {% else %}
                nothing scheduled in the next 8 hours
              {% endif %}
            {% endif %}
          context_pairs: >-
            {{
              [
                ['User', user | title],
                ['Habit name', habit_name],
                ['Habit type', habit_type],
                ['Current streak (days)', streak_days],
                ['Days since last completed', days_since_completion],
                ['Mood today', mood_today],
                ['Mood note', mood_note],
                ['Location category', location_category],
                ['Calendar availability', calendar_availability],
                ['Workday', workday],
                ['Current physical activity', activity_state],
                ['Steps so far today', steps_today],
                ['Exercise bike active (minutes)', bike_active_minutes],
                ['Weather', weather_summary],
                ['Daylight remaining (minutes)', daylight_remaining],
                ['Local time', now().strftime('%H:%M')],
                ['Reminder attempt', reminder_attempt],
              ]
              | rejectattr(
                '1',
                'in',
                ['', 'none', 'unknown', 'unavailable', 'Not Set', 0, None],
              )
              | list
            }}

      - alias: Generate AI reminder message
        continue_on_error: true
        action: ai_task.generate_data
        response_variable: ai_result
        data:
          entity_id: ai_task.habit_reminder_ai
          task_name: "habit reminder {{ habit_prefix }}"
          instructions: |-
            Write one short habit reminder notification message.

            Tone: neutral, positive, and encouraging. Do not be sarcastic,
            preachy, or overly casual. Do not invent facts.

            Requirements:
            - Return only the notification message text
            - One or two short sentences maximum
            - Mention the habit name naturally
            - You may mention streak, mood, or that this is a repeat
              reminder when that context is useful
            - Use location only when it materially affects whether the habit
              is feasible right now. For example, do not encourage doing
              skincare immediately when the user is at work; still give a
              useful reminder (e.g. do it later, or keep a streak in mind)
            - If the user is in a meeting or has only a short free window,
              suggest a realistic later time instead of interrupting them
            - Use weather and daylight only when they materially affect an
              outdoor habit
            - Do not name specific places, addresses, or coordinates
            - Do not include markdown, emojis, quotes, or a title

            Context:
            {% for label, value in context_pairs %}
            - {{ label }}: {{ value }}
            {% endfor %}
      - variables:
          generated_message: >-
            {{
              ai_result.data
              if ai_result is defined
                and ai_result.data is defined
                and (ai_result.data | string | trim) != ''
              else ''
            }}

  - variables:
      message: >-
        {{
          generated_message
          if generated_message | string | trim != ''
          else fallback_message
        }}

  - alias: Send habit reminder notification
    action: "script.notify_{{ user }}"
    data:
      title: "Habit Reminder"
      message: "{{ message }}"
      notification_id: "{{ notification_id }}"
      url: "{{ notification_url }}"
      actions:
        - action: "{{ action_id }}"
          title: "{{ action_title }}"
