---
# Provisional human-presence inference for the dining area.
#
# Shadow mode: lighting automations consume binary_sensor.dining_area_occupancy.
platform: bayesian

name: Dining Area Bayesian Presence

unique_id: dining_area_bayesian_presence

device_class: occupancy

prior: 0.08

# A Frigate person plus retained basement presence reaches about 66% when FP2
# briefly drops out; pet evidence still keeps the posterior well below this.
probability_threshold: 0.66

observations:
  # Strong: Frigate's dining-area zone has identified a person
  - platform: state
    entity_id: binary_sensor.dining_area_person_occupancy
    to_state: "on"
    prob_given_true: 0.9
    prob_given_false: 0.03

  # Gate: the dining area cannot be human-occupied when the wider basement is vacant
  - platform: state
    entity_id: binary_sensor.basement_human_presence
    to_state: "on"
    prob_given_true: 0.98
    prob_given_false: 0.3

  # Supporting: FP2 dining-area zone, which is useful but can be sticky
  - platform: state
    entity_id: binary_sensor.dining_area_occupancy
    to_state: "on"
    prob_given_true: 0.9
    prob_given_false: 0.45

  # Negative evidence: zone activity attributable to a pet, not a person
  - platform: template
    value_template: >-
      {{
        is_state('binary_sensor.dining_area_person_occupancy', 'off') and
        (
          is_state('binary_sensor.dining_area_cat_occupancy', 'on') or
          is_state('binary_sensor.dining_area_dog_occupancy', 'on')
        )
      }}
    prob_given_true: 0.05
    prob_given_false: 0.25
