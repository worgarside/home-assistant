---
alias: /switch/charging-hub/turn-off

id: switch_charging_hub_turn_off

description: Turn off the charging hub when everything has finished charging

mode: single

max_exceeded: silent

trigger:
  - platform: numeric_state
    entity_id: sensor.charging_hub_load_power
    below: input_number.charging_hub_auto_off_threshold
    for:
      minutes: 2

action:
  - variables:
      power: "{{ trigger.to_state.state }}"
      threshold: "{{ states('input_number.charging_hub_auto_off_threshold') }}"

  - action: switch.turn_off
    target:
      entity_id: switch.charging_hub

  - if: "{{ is_state('input_boolean.charging_hub_auto_off_notification', 'on') }}"
    then:
      - action: script.notify_will
        continue_on_error: true
        data:
          title: Charging Hub
          message: >-
            Charging hub turned off — devices finished charging.
            Power: {{ power }} W (threshold: {{ threshold }} W)
          notification_id: charging_hub_auto_off
          mobile_notification_icon: mdi:power-plug-off
