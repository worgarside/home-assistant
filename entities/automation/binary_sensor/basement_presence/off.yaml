---
alias: /binary-sensor/basement-presence/off

id: binary_sensor_basement_presence_off

description: >-
  Turns off the basement after the configured human-presence retention period and resumes Cosmo
  when he was paused while cleaning the basement.

mode: single

max_exceeded: silent

trigger:
  - platform: state
    entity_id: binary_sensor.basement_human_presence
    from: "on"
    to: "off"

condition: "{{ is_state('input_boolean.visitor_mode', 'off') }}"

action:
  - parallel:
      - if: >
          {{
            is_state('vacuum.cosmo', 'paused') and
            is_state('sensor.cosmo_current_room', 'Basement')
          }}
        then:
          - action: vacuum.start
            target:
              entity_id: vacuum.cosmo

      - action: light.turn_off
        target:
          floor_id: basement
        data:
          transition: 5

      - action: switch.turn_off
        continue_on_error: true
        target:
          entity_id: switch.basement_christmas_tree

      - alias: Re-enable dining area automation
        action: automation.turn_on
        target:
          entity_id: automation.binary_sensor_dining_area_occupancy_state_change
      - alias: Re-enable kitchen automation
        action: automation.turn_on
        target:
          entity_id: automation.binary_sensor_kitchen_occupancy_state_change
