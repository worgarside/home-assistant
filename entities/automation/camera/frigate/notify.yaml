---
alias: /camera/frigate/notify

id: camera_frigate_notify

description: >-
  Notify Will and Vic immediately for front-door reviews, then silently update their
  notifications with Frigate's AI-generated summary. Under normal filtering, pet and indoor
  person reviews notify only when nobody is home. input_boolean.frigate_bypass_filters bypasses
  the noise-reduction gating for Will only; Vic's notifications are enabled by
  input_boolean.frigate_notify_vic and are always filtered.

mode: parallel

max: 10

max_exceeded: silent

trigger:
  - platform: mqtt
    topic: frigate/reviews
    value_template: "{{ value_json.type }}"
    payload: new
    id: new

  - platform: mqtt
    topic: frigate/reviews
    value_template: "{{ value_json.type }}"
    payload: genai
    id: genai

  - platform: mqtt
    topic: frigate/reviews
    value_template: "{{ value_json.type }}"
    payload: update
    id: update

variables:

  home_assistant_external_url: !secret home_assistant_external_url

  supported_cameras:
    - front_door
    - basement
    - lounge

  supported_objects:
    - person
    - cat
    - dog

  camera_names:
    front_door: Front Door
    basement: Basement
    lounge: Lounge

  review: "{{ trigger.payload_json.get('after', {}) }}"

  review_data: "{{ review.get('data', {}) }}"

  camera: "{{ review.get('camera', '') }}"

  camera_name: "{{ camera_names.get(camera, camera | replace('_', ' ') | title) }}"

  objects: "{{ review_data.get('objects', []) }}"

  sub_labels: "{{ review_data.get('sub_labels', []) }}"

  recognized_name: "{{ sub_labels | first | default('', true) }}"

  detections: "{{ review_data.get('detections', []) }}"

  review_id: "{{ review.get('id', '') }}"

  detection_id: "{{ detections | first | default(review_id, true) }}"

  metadata: "{{ review_data.get('metadata', {}) }}"

  is_pet: "{{ 'cat' in objects or 'dog' in objects }}"

  is_away: "{{ states('zone.home') | int(0) < 1 }}"

  is_front_door_person: "{{ 'person' in objects and camera == 'front_door' }}"

  notify_normally: >-
    {{
      (trigger.id == 'new' and (is_front_door_person or (is_pet and is_away)))
      or (trigger.id == 'genai' and (is_front_door_person or is_away))
      or (trigger.id == 'update' and recognized_name | length > 0
          and (is_front_door_person or is_away))
    }}

  detected_object: >-
    {{
      'person'
      if 'person' in objects
      else 'dog'
      if 'dog' in objects
      else 'cat'
      if 'cat' in objects
      else 'activity'
    }}

  notification_title: >-
    {{
      metadata.get('title', detected_object | title ~ ' on ' ~ camera_name)
      if trigger.id == 'genai'
      else recognized_name ~ ' on ' ~ camera_name
      if recognized_name | length > 0
      else detected_object | title ~ ' on ' ~ camera_name
    }}

  notification_message: >-
    {{
      metadata.get(
        'shortSummary',
        'Frigate detected a ' ~ detected_object ~ ' on the ' ~ camera_name ~ ' camera.'
      )
      if trigger.id == 'genai'
      else 'Frigate recognised ' ~ recognized_name ~ ' on the ' ~ camera_name ~ ' camera.'
      if recognized_name | length > 0
      else 'Frigate detected a ' ~ detected_object ~ ' on the ' ~ camera_name ~ ' camera.'
    }}

  snapshot_url: >-
    {{ home_assistant_external_url }}/api/frigate/notifications/{{ detection_id }}/snapshot.jpg

  clip_url: >-
    {{ home_assistant_external_url }}/api/frigate/notifications/{{ detection_id }}/clip.mp4

condition:
  # Valid camera, severity, object type, and IDs needed for notification media
  - condition: template
    value_template: >-
      {{
        camera in supported_cameras and
        review.get('severity') in ['alert', 'detection'] and
        objects | select('in', supported_objects) | list | count > 0 and
        review_id | length > 0 and
        detection_id | length > 0
      }}

action:
  - parallel:
      # Will gets normally-filtered reviews, plus anything let through by
      # input_boolean.frigate_bypass_filters
      - if: >-
          {{ notify_normally or is_state('input_boolean.frigate_bypass_filters', 'on') }}
        then:
          - action: script.notify_will
            continue_on_error: true
            data:
              title: "{{ notification_title }}"
              message: "{{ notification_message }}"
              notification_id: frigate_{{ camera }}_{{ review_id }}
              mobile_notification_icon: >-
                {{ 'mdi:doorbell-video' if camera == 'front_door' else 'mdi:cctv' }}
              group: "frigate-{{ camera | replace('_', '-') }}"
              sticky: true
              alert_once: true
              image: "{{ snapshot_url }}"
              url: "{{ clip_url }}"
              actions:
                - action: URI
                  title: View Clip
                  uri: "{{ clip_url }}"

      # Vic only gets normally-filtered reviews while her notification toggle is enabled;
      # bypass_filters doesn't apply to her
      - if: >-
          {{ notify_normally and is_state('input_boolean.frigate_notify_vic', 'on') }}
        then:
          - action: script.notify_vic
            continue_on_error: true
            data:
              title: "{{ notification_title }}"
              message: "{{ notification_message }}"
              notification_id: frigate_{{ camera }}_{{ review_id }}
              mobile_notification_icon: >-
                {{ 'mdi:doorbell-video' if camera == 'front_door' else 'mdi:cctv' }}
              group: "frigate-{{ camera | replace('_', '-') }}"
              sticky: true
              image: "{{ snapshot_url }}"
              url: "{{ clip_url }}"
              actions:
                - action: URI
                  title: View Clip
                  uri: "{{ clip_url }}"
