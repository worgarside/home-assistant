---
alias: /homeassistant/handle-service-reload

id: homeassistant_handle_service_reload

mode: queued

max: 50

max_exceeded: silent

trigger:
  platform: event
  event_type: folder_watcher
  event_data:
    event_type: modified

variables:
  domain: >-
    {% set parts = trigger.event.data.path.split("/") %}
    {% if parts | length > 3 %}
      {{ parts[3] }}
    {% endif %}

  service_mapping:
    media_player: universal
    template_triggered: template

  service: "{{ service_mapping.get(domain, domain) }}"

  file_key: >-
    {{
      trigger.event.data.path[(("/config/entities/" ~ domain ~ "/") | length):]
      if trigger.event.data.path.startswith("/config/entities/" ~ domain ~ "/")
      else trigger.event.data.file
    }}

  reloadable_services:
    - automation
    - command_line
    - conversation
    - group
    - input_boolean
    - input_button
    - input_datetime
    - input_number
    - input_select
    - input_text
    - mqtt
    - rest
    - rest_command
    - scene
    - schedule
    - script
    - template
    - timer
    - universal
    - var
    - zone

  auto_reload_boolean: input_boolean.auto_reload_{{ service }}

condition: >-
  {{
    trigger.event.data.path.startswith('/config/entities') and
    service in reloadable_services
  }}

action:
  - action: script.turn_on
    target:
      entity_id: script.debug_persistent_notification
    data:
      variables:
        notification_title: Auto-Reload Required for `{{ service }}`
        message: >-
          Triggered by `{{ trigger.event.data.folder }}/{{ trigger.event.data.file}}`
        notification_id: "{{ service }}_auto_reload_required"

  - variables:
      pending: >-
        {{
          state_attr('var.auto_reload_queue', 'pending')
          | default('{}', true)
          | from_json
        }}

      in_flight: >-
        {{
          state_attr('var.auto_reload_queue', 'in_flight')
          | default('[]', true)
          | from_json
        }}

      domain_files: "{{ pending.get(service, []) }}"

      new_domain_files: >-
        {{
          iif(
            file_key in domain_files,
            domain_files,
            domain_files + [file_key]
          )
        }}

      new_pending: "{{ dict(pending, **{service: new_domain_files}) }}"

      pending_domain_count: >-
        {{ new_pending.values() | reject('eq', []) | list | count }}

      dispatch_reload: >-
        {{
          service not in in_flight and
          is_state(auto_reload_boolean, 'on')
        }}

      new_in_flight: >-
        {{
          (in_flight + [service]) if dispatch_reload else in_flight
        }}

  - action: var.set
    target:
      entity_id: var.auto_reload_queue
    data:
      value: "{{ pending_domain_count }}"
      attributes: >-
        {{
          {
            "pending": new_pending | to_json,
            "in_flight": new_in_flight | to_json
          }
        }}

  - if: "{{ dispatch_reload }}"

    then:
      - action: script.turn_on
        target:
          entity_id: script.debug_persistent_notification
        data:
          variables:
            notification_title: Auto-Reloading `{{ service }}` Entities
            message: >-
              Reloading {{ service }} entities. Triggered by
              `{{ trigger.event.data.folder }}/{{ trigger.event.data.file}}`
            notification_id: "{{ service }}_auto_reload"

      - action: script.system_reload_domain
        data:
          domain: "{{ service }}"
