---
alias: /input-datetime/habit/vic-habit-binary-8/reminder

id: input_datetime_habit_vic_habit_binary_8_reminder

description: Remind to log Vic's binary habit 8 at configured reminder time

mode: single

trigger:
  - platform: time
    at: input_datetime.vic_habit_binary_8_reminder_time

condition: >-
  {{
    is_state('input_boolean.vic_habit_binary_8', 'off') and
    states("input_text.vic_habit_binary_8_name") not in ["", "unknown"]
  }}

variables:
  repeat_interval: >-
    {{
      states('input_number.vic_habit_binary_8_repeat_reminder_interval') | int(60)
    }}
  repeat_reminder_count: >-
    {{
      states('input_number.vic_habit_binary_8_repeat_reminder_count') | int(0)
    }}

action:
  - action: script.habit_send_reminder
    data:
      user: vic
      habit_type: binary
      habit_number: 8
      reminder_index: 1

  - if: "{{ repeat_reminder_count | int(0) > 0 }}"
    then:
      - repeat:
          until: >-
            {%
              set cutoff_time = (
                now().replace(hour=0, minute=0, second=0, microsecond=0)
                + timedelta(days=1)
                - timedelta(minutes=(repeat_interval + 5))
              )
            %}
            {% set habit_completed = is_state('input_boolean.vic_habit_binary_8', 'on') %}
            {{
              now() >= cutoff_time or
              repeat.index > repeat_reminder_count | int(0) or
              habit_completed
            }}
          sequence:
            - delay:
                minutes: "{{ repeat_interval | int(60) }}"

            - action: script.habit_send_reminder
              data:
                user: vic
                habit_type: binary
                habit_number: 8
                reminder_index: "{{ repeat.index + 1 }}"
