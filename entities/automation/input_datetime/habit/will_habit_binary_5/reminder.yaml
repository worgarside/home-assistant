---
alias: /input-datetime/habit/will-habit-binary-5/reminder

id: input_datetime_habit_will_habit_binary_5_reminder

description: Remind to log Will's binary habit 5 at configured reminder time

mode: single

trigger:
  - platform: time
    at: input_datetime.will_habit_binary_5_reminder_time

condition: >-
  {{
    is_state('input_boolean.will_habit_binary_5', 'off') and
    states("input_text.will_habit_binary_5_name") not in ["", "unknown"]
  }}

variables:
  repeat_interval: >-
    {{
      states('input_number.will_habit_binary_5_repeat_reminder_interval') | int(60)
    }}
  repeat_reminder_count: >-
    {{
      states('input_number.will_habit_binary_5_repeat_reminder_count') | int(0)
    }}

action:
  - action: script.habit_send_reminder
    continue_on_error: true
    data:
      user: will
      habit_type: binary
      habit_number: 5
      reminder_index: 1

  - if: "{{ repeat_reminder_count | int(0) > 0 }}"
    then:
      - repeat:
          until: >-
            {%
              set cutoff_time = (
                now().replace(hour=0, minute=0, second=0, microsecond=0)
                + timedelta(days=1)
                - timedelta(minutes=(repeat_interval + 5))
              )
            %}
            {% set habit_completed = is_state('input_boolean.will_habit_binary_5', 'on') %}
            {{
              now() >= cutoff_time or
              repeat.index > repeat_reminder_count | int(0) or
              habit_completed
            }}
          sequence:
            - delay:
                minutes: "{{ repeat_interval | int(60) }}"

            - action: script.habit_send_reminder
              continue_on_error: true
              data:
                user: will
                habit_type: binary
                habit_number: 5
                reminder_index: "{{ repeat.index + 1 }}"
